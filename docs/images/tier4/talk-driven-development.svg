<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 630" width="780" height="630" role="img" aria-labelledby="title desc">
<title id="title">Talk-driven development</title>
<desc id="desc">Four layers of knowledge. The research agents produce results. You and the talks session understand them. The group questions them. The field holds the literature, its state of knowledge, and the scientific community. The manuscript session reads the literature in, and people write the paper that goes back out. A support layer keeps the rest running.</desc>
<style>
  .bg { fill: #ffffff; }
  .layer { fill: #f3f3f1; }
  .lit { fill: none; stroke: #a9a9a9; stroke-width: 1.5; stroke-dasharray: 6 4; }
  .agent { fill: #ffffff; stroke: #a9a9a9; stroke-width: 1; }
  .human { fill: #ffffff; stroke: #5b3fc4; stroke-width: 2.2; }
  .name { font-family: "Latin Modern Mono", "DejaVu Sans Mono", monospace; font-size: 15px; fill: #222222; text-anchor: middle; dominant-baseline: central; }
  .person { font-family: "Gill Sans", "Gill Sans MT", "Gillius ADF", Optima, Lato, sans-serif; font-size: 18px; fill: #222222; text-anchor: middle; dominant-baseline: central; }
  .small { font-size: 12px; }
  .serif { font-family: "Latin Modern Roman", Georgia, serif; fill: #222222; }
  .title { font-size: 18px; text-anchor: middle; }
  .note { font-size: 13px; font-style: italic; fill: #666666; }
  .label { font-size: 14px; }
  .tier { font-size: 14px; font-style: italic; fill: #666666; }
  .arrow { stroke: #444444; stroke-width: 1.5; fill: none; marker-end: url(#head); }
  .both { stroke: #444444; stroke-width: 1.5; fill: none; marker-start: url(#head); marker-end: url(#head); }
  .dotted { stroke: #444444; stroke-width: 1.8; stroke-dasharray: 0.1 5; stroke-linecap: round; }
  .dashed { stroke: #444444; stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; marker-end: url(#head); }
  .headfill { fill: #444444; }
</style>
<defs>
  <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path class="headfill" d="M0,0 L10,5 L0,10 z"/>
  </marker>
</defs>
<rect class="bg" width="780" height="630"/>

<!-- the field: the literature (not an agent) and the scientific community (people) -->
<rect class="layer" x="30" y="20" width="600" height="80" rx="3"/>
<rect class="lit" x="50" y="34" width="270" height="52" rx="3"/>
<text class="serif title" x="185" y="55">the literature</text>
<text class="serif note" x="185" y="75" text-anchor="middle">the field's state of knowledge</text>
<rect class="human" x="350" y="40" width="250" height="40" rx="3"/>
<text class="person" x="475" y="60">the scientific community</text>
<text class="serif tier" x="648" y="64">the field</text>

<g transform="translate(0 40)">
<!-- the paper goes up, written by people -->
<line class="arrow" x1="300" y1="122" x2="300" y2="50"/>
<text class="serif label" x="310" y="96">the paper, written by people</text>


<!-- the group -->
<rect class="layer" x="30" y="110" width="600" height="56" rx="3"/>
<rect class="human" x="270" y="122" width="120" height="32" rx="3"/>
<text class="person" x="330" y="138">the group</text>
<text class="serif tier" x="648" y="142">the group</text>

<!-- slides up, questions down -->
<line class="arrow" x1="322" y1="218" x2="322" y2="170"/>
<line class="arrow" x1="338" y1="170" x2="338" y2="218"/>
<text class="serif label" x="312" y="198" text-anchor="end">slides</text>
<text class="serif label" x="348" y="198">questions</text>

<!-- the live layer -->
<rect class="layer" x="30" y="222" width="600" height="68" rx="3"/>
<rect class="human" x="125" y="240" width="80" height="32" rx="3"/>
<text class="person" x="165" y="256">you</text>
<line class="both" x1="210" y1="256" x2="280" y2="256"/>
<rect class="agent" x="285" y="240" width="90" height="32" rx="3"/>
<text class="name" x="330" y="256">talks</text>
<line class="dotted" x1="380" y1="256" x2="476" y2="256"/>
<rect class="agent" x="480" y="240" width="90" height="32" rx="3"/>
<text class="name" x="525" y="256">helper</text>
<text class="serif tier" x="648" y="260">you</text>

<!-- results up, analyses down -->
<line class="arrow" x1="322" y1="342" x2="322" y2="294"/>
<line class="arrow" x1="338" y1="294" x2="338" y2="342"/>
<text class="serif label" x="312" y="322" text-anchor="end">results</text>
<text class="serif label" x="348" y="315">analyses to formalize</text>
<text class="serif note" x="348" y="332">once a result is worth keeping</text>

<!-- research -->
<rect class="layer" x="30" y="346" width="600" height="104" rx="3"/>
<rect class="agent" x="60" y="364" width="80" height="32" rx="3"/>
<text class="name" x="100" y="380">ms</text>
<rect class="agent" x="230" y="364" width="80" height="32" rx="3"/>
<text class="name" x="270" y="380">EPIC</text>
<rect class="agent" x="420" y="364" width="120" height="32" rx="3"/>
<text class="name" x="480" y="380">conductor</text>
<rect class="agent" x="434" y="408" width="28" height="22" rx="3"/>
<text class="name small" x="448" y="419">w</text>
<rect class="agent" x="466" y="408" width="28" height="22" rx="3"/>
<text class="name small" x="480" y="419">w</text>
<rect class="agent" x="498" y="408" width="28" height="22" rx="3"/>
<text class="name small" x="512" y="419">w</text>
<text class="serif tier" x="648" y="384">research</text>

<!-- support -->
<rect class="layer" x="30" y="470" width="600" height="60" rx="3"/>
<rect class="agent" x="56" y="484" width="80" height="32" rx="3"/>
<text class="name" x="96" y="500">staff</text>
<rect class="agent" x="156" y="484" width="100" height="32" rx="3"/>
<text class="name" x="206" y="500">sysadmin</text>
<rect class="agent" x="276" y="484" width="80" height="32" rx="3"/>
<text class="name" x="316" y="500">infra</text>
<rect class="agent" x="376" y="484" width="100" height="32" rx="3"/>
<text class="name" x="426" y="500">librarian</text>
<rect class="agent" x="496" y="484" width="110" height="32" rx="3"/>
<text class="name" x="551" y="500">bipartite</text>
<text class="serif tier" x="648" y="504">support</text>

<!-- ms reads the literature in; drawn over the layers -->
<line class="dashed" x1="100" y1="46" x2="100" y2="362"/>
<text class="serif label" x="110" y="98">reads it in</text>

<text class="serif note" x="330" y="560" text-anchor="middle">layers of knowledge, not of authority</text>
</g>
</svg>
