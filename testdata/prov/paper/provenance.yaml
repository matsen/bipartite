runs:
  "pipe":
    facts: {repo: org/code, sha: "@C3@", path: facts_pipeline.json}
  "multi":
    facts: {repo: org/code, sha: "@C3@", path: facts_launches.json}
    launches: ["@D@"]   # adds a third launch, one no ref contains
entries:
  same1:
    repo: org/code
    sha: "@C1@"
    path: results.json
    key: corpus.pcps_changed
    value: 0.020769
    token: "2.1\\%"
    scope: "tree edges of the sample"
  same2:   # re-rendered file, same value
    repo: org/code
    sha: "@C2@"
    path: results.json
    key: corpus.pcps_changed
    value: 0.020769
    token: "2.1\\%"
    scope: "tree edges of the sample"
  changed:
    repo: org/code
    sha: "@C3@"
    path: results.json
    key: corpus.pcps_changed
    value: 0.020769
    scope: "tree edges of the sample"
  crlf:
    repo: org/code
    sha: "@C1@"
    path: nextflow.config
    pattern: |-
      joint = true
      other = 1
  multi:
    run: "multi"
    path: nextflow.config
    pattern: "joint = true"
  pipe:
    run: "pipe"
    path: nextflow.config
    pattern: "other = 1"
  renamed:   # old.txt was renamed to new.txt at C2
    repo: org/code
    sha: "@C2@"
    path: old.txt
    pattern: "so"
  unreach:
    repo: org/code
    sha: "@D@"
    path: nextflow.config
    pattern: "joint"
  spare:
    unsourced: "no committed source"
  d_changed:   # computed from an input whose value changed
    from: [crlf, changed]
    scope: "derived"
  d_clean:
    from: [crlf]
    scope: "derived"
  d_trans:     # changed only through d_changed
    from: [d_clean, d_changed]
    scope: "derived"
  d_unreach:   # its input's commit is unreachable
    from: [unreach]
    scope: "derived"
  d_missing:
    from: [nosuch_entry]
    scope: "derived"
  cyc_a:
    from: [cyc_b]
    scope: "derived"
  cyc_b:
    from: [cyc_a]
    scope: "derived"
  op_a:
    unsourced: "fixture input"
    value: 3
  op_b:
    unsourced: "fixture input"
    value: 4
  op_sum_ok:
    from: [op_a, op_b]
    op: sum
    value: 7
    scope: "derived"
  op_sum_bad:   # the 4,019,129-for-4,019,130 case
    from: [op_a, op_b]
    op: sum
    value: 8
    scope: "derived"
  op_ratio_ok:  # 0.75 rounds to 0.8 at one decimal
    from: [op_a, op_b]
    op: ratio
    value: 0.8
    scope: "derived"
  op_ratio_bad:
    from: [op_a, op_b]
    op: ratio
    value: 0.7
    scope: "derived"
  dotted:     # a JSON key that itself contains "."
    repo: org/code
    sha: "@C3@"
    path: results.json
    key: pcps/combined.csv/root_parent
    value: 3311128
    scope: "fixture"
  pv_ok:      # a pattern entry whose value is part of the matched text
    repo: org/code
    sha: "@C1@"
    path: nextflow.config
    pattern: "other = 1"
    value: 1
    scope: "fixture"
  pv_bad:
    repo: org/code
    sha: "@C1@"
    path: nextflow.config
    pattern: "other = 1"
    value: 2
    scope: "fixture"
